name: 학생 작품 전시 신청
description: 웹앱 링크와 우리 팀의 이야기를 제출합니다. 담당 교사 확인 후 작품전에 공개됩니다.
title: "[작품전] 작품명을 적어 주세요"
body:
  - type: markdown
    attributes:
      value: |
        HYFL AI LAB 학생 작품전입니다. 팀당 한 번 제출하고 수정할 때는 이 신청의 본문을 편집해 주세요.
        아래 내용은 공개됩니다. 실명 대신 팀명을 사용하고, API 키·개인정보·얼굴이 포함된 화면은 올리지 마세요.
        대표 화면은 아래 마지막 칸에 이미지 파일을 끌어 놓아 첨부할 수 있습니다.
  - type: dropdown
    id: category
    attributes:
      label: 전시 부문
      options:
        - AI × DATA
        - Teachable Machine
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 작품명
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: 팀명
    validations:
      required: true
  - type: input
    id: classroom
    attributes:
      label: 반
      placeholder: "예: 2학년 10반"
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: 제작 연도
      placeholder: "예: 2026"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 웹앱 주소
      placeholder: "https://… (로그아웃 상태에서도 열리는 실제 실행 주소)"
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: 주제
      placeholder: "예: 안전·교통, 환경, 건강, 교육, 문화"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 우리가 시작한 질문
      description: 누구의 어떤 불편이나 궁금증에서 출발했나요? 1~3문장으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 이렇게 사용해 보세요
      description: 관람자가 무엇을 입력하거나 눌러 보면 되나요? 핵심 기능을 짧게 소개하세요.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 데이터 또는 모델 이야기
      description: 공공데이터 이름·출처 링크 또는 직접 수집한 학습 데이터·분류 클래스를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: 만들며 알게 된 점
      description: 직접 시험한 결과, 바꾼 판단, 아직 개선할 점을 적어 주세요. AI의 도움을 받은 부분도 함께 소개하세요.
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: 대표 화면
      description: 웹앱 화면 한 장을 첨부하세요. 선택 사항입니다.
  - type: checkboxes
    id: consent
    attributes:
      label: 공개 전 확인
      options:
        - label: 팀원과 공개에 동의했고, 링크를 직접 열어 보았으며, 개인정보와 비밀 키를 제외했습니다.
          required: true
