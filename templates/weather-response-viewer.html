<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>저장한 기상청 실황 확인</title><style>body{font-family:system-ui;max-width:42rem;margin:2rem auto;padding:0 1rem;line-height:1.7}input,button{font:inherit;max-width:100%}#result{white-space:pre-wrap;padding:1rem;background:#f0f5fa}label{display:block;margin:.8rem 0}</style></head><body>
<h1>저장한 기상청 실황 확인</h1><p><strong>저장된 자료, 실시간 아님</strong> · 이 파일은 API를 호출하지 않습니다.</p>
<p>기상청 초단기실황의 정상 JSON 응답을 파일로 저장한 뒤 선택하세요. 인증키·개인정보가 없는 공개 응답만 사용합니다.</p>
<label>조회한 시각(직접 기록) <input id="queried" placeholder="예: 조회한 날짜와 한국 시각"></label>
<label>실제 응답 JSON 파일 <input id="file" type="file" accept=".json,application/json"></label>
<p id="result" role="status" aria-live="polite">파일을 선택하면 T1H 항목을 찾아 표시합니다.</p>
<p>출처: <a href="https://www.data.go.kr/data/15084084/openapi.do">기상청 단기예보 조회서비스 · 초단기실황</a></p>
<script>
// parser-start
function readTemperature(raw) {
  const response = raw?.response;
  const header = response?.header;
  if (!header || header.resultCode === undefined) throw new Error('응답 형식을 확인하세요: response.header가 없습니다. JSON 요청인지 확인하세요.');
  const code = String(header.resultCode);
  if (code === '03') return {kind:'empty'};
  if (code !== '00') throw new Error('기관 응답 ' + code + ': ' + String(header.resultMsg ?? '메시지 없음'));
  const value = response?.body?.items?.item;
  const items = Array.isArray(value) ? value : value && typeof value === 'object' ? [value] : [];
  if (!items.length) return {kind:'empty'};
  const item = items.find(row => row.category === 'T1H');
  if (!item) return {kind:'missing-temperature'};
  const temperature = String(item.obsrValue ?? '').trim();
  if (temperature === '' || !Number.isFinite(Number(temperature))) throw new Error('T1H의 obsrValue가 올바른 숫자인지 확인하세요.');
  if (Number(temperature) >= 900 || Number(temperature) <= -900) return {kind:'missing-value'};
  return {kind:'temperature',temperature,baseDate:String(item.baseDate ?? '확인 필요'),baseTime:String(item.baseTime ?? '확인 필요'),nx:String(item.nx ?? '확인 필요'),ny:String(item.ny ?? '확인 필요')};
}
// parser-end
const output = document.getElementById('result');
document.getElementById('file').addEventListener('change',async(event)=>{
 const file=event.target.files[0]; if(!file)return; output.textContent='파일을 읽는 중입니다.';
 try {
  const parsed=readTemperature(JSON.parse(await file.text()));
  if(parsed.kind==='empty'){output.textContent='자료없음 응답이거나 자료 목록이 비어 있습니다. 조건과 제공 범위를 확인하세요.';return;}
  if(parsed.kind==='missing-value'){output.textContent='기온이 결측값입니다. 관측값이 없는 상태를 실제 온도로 표시하지 않습니다.';return;}
  if(parsed.kind==='missing-temperature'){output.textContent='받은 항목에 T1H가 없습니다. category와 페이지·조회 범위를 확인하세요.';return;}
  output.textContent=`기온: ${parsed.temperature} ℃\n관측 기준: ${parsed.baseDate} ${parsed.baseTime} (한국 시각)\n격자: nx=${parsed.nx}, ny=${parsed.ny}\n조회한 시각: ${document.getElementById('queried').value || '직접 기록 필요'}\n저장된 자료, 실시간 아님`;
 } catch(error){output.textContent='확인 필요: '+error.message;}
});
</script></body></html>
