<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 분류 AI 체험</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <style>
    :root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#172033;background:#f4f7fb;line-height:1.6}*{box-sizing:border-box}body{margin:0}main{width:min(980px,100%);margin:auto;padding:24px 16px 56px}.hero,.card{background:#fff;border:1px solid #dce3ed;border-radius:18px;box-shadow:0 8px 30px #1d35570d}.hero{padding:clamp(24px,5vw,48px);background:linear-gradient(135deg,#eef7ff,#fff)}.eyebrow{margin:0;color:#1769aa;font-size:.78rem;font-weight:800;letter-spacing:.08em}.hero h1{margin:.35rem 0 .5rem;font-size:clamp(1.75rem,5vw,3rem);line-height:1.2}.hero p{margin:.3rem 0;color:#526074}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.card{padding:20px}.card h2{margin:0 0 12px;font-size:1.12rem}.lab{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:16px}.viewer{display:grid;place-items:center;min-height:310px;overflow:hidden;border-radius:14px;background:#0f172a;color:#cbd5e1}.viewer canvas{display:block;width:100%;height:auto;max-height:520px;object-fit:contain}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.controls button,.controls select{min-height:46px;border-radius:10px;padding:0 14px;font:inherit;font-weight:750}.controls button{border:0;background:#1769aa;color:#fff;cursor:pointer}.controls button.secondary{background:#e8eef6;color:#27364d}.controls button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:48px;margin:10px 0;padding:11px 13px;border-radius:10px;background:#eef4fb;color:#34445c}.status.error{background:#fff0f0;color:#a32727}.winner{min-height:100px;padding:18px;border-radius:14px;background:#eff8ff;text-align:center}.winner small{display:block;color:#526074}.winner strong{display:block;margin-top:4px;color:#0d5d9b;font-size:1.65rem}.bars{display:grid;gap:10px;margin-top:16px}.bar-head{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}.bar-track{height:10px;overflow:hidden;border-radius:99px;background:#e6ebf2}.bar-fill{height:100%;width:0;background:#2a83c6;transition:width .12s linear}.notice{margin:16px 0 0;color:#5e6878;font-size:.86rem}.footer-card{margin-top:16px}.footer-card dl{display:grid;grid-template-columns:max-content 1fr;gap:7px 14px;margin:0}.footer-card dt{font-weight:800}.footer-card dd{margin:0;color:#526074}@media(max-width:720px){main{padding:12px 12px 40px}.meta,.lab{grid-template-columns:1fr}.hero,.card{border-radius:14px}.viewer{min-height:240px}.controls>*{flex:1}.footer-card dl{grid-template-columns:1fr}.footer-card dd{margin-bottom:8px}}
  </style>
</head>
<body>
<main>
  <header class="hero"><p class="eyebrow">TEACHABLE MACHINE · IMAGE</p><h1 id="projectTitle"></h1><p id="summary"></p><p><b id="team"></b> · <span id="members"></span></p></header>
  <section class="meta"><article class="card"><h2>해결하려는 문제</h2><p id="problem"></p></article><article class="card"><h2>주요 사용자</h2><p id="user"></p></article></section>
  <section class="lab"><article class="card"><h2>모델 직접 시험하기</h2><div class="viewer" id="viewer">시작 버튼을 누르면 카메라가 열립니다.</div><div class="controls"><select id="camera"><option value="user">전면 카메라</option><option value="environment">후면 카메라</option></select><button id="start">시작</button><button id="stop" class="secondary" disabled>중지</button></div><div id="status" class="status" role="status" aria-live="polite">모델을 시작할 준비가 되었습니다.</div></article>
  <article class="card"><h2>분류 결과</h2><div class="winner"><small>가장 높은 예측</small><strong id="winner">아직 예측하지 않았습니다</strong></div><div id="bars" class="bars"></div><p class="notice">가장 높은 확률이 반드시 정답이라는 뜻은 아닙니다. 실제 상태를 사람이 다시 확인하세요.</p></article></section>
  <section class="card footer-card"><h2>사용 전에 확인하세요</h2><dl><dt>모델의 한계</dt><dd id="limits"></dd><dt>사람이 확인할 부분</dt><dd id="humanCheck"></dd></dl></section>
</main>
<script>
// ===== 여기부터 우리 팀이 수정 =====
const CONFIG = {
  modelUrl: "https://teachablemachine.withgoogle.com/models/여기에-모델-ID/",
  projectTitle: "우리 팀 이미지 분류 AI",
  summary: "카메라로 대상을 보여주면 모델이 상태를 분류합니다.",
  team: "팀명",
  members: "팀원 이름",
  problem: "STEP 1에서 정한 해결하려는 문제",
  user: "이 모델이 필요한 주요 사용자",
  limits: "STEP 3에서 확인한 모델의 한계",
  humanCheck: "결과를 사용하기 전에 사람이 최종 확인할 내용"
};
// ===== 여기까지 우리 팀이 수정 =====

const $=id=>document.getElementById(id); let model=null,webcam=null,raf=0,running=false;
function fill(){['projectTitle','summary','team','members','problem','user','limits','humanCheck'].forEach(k=>$(k).textContent=CONFIG[k]);document.title=CONFIG.projectTitle}
function baseUrl(){const u=CONFIG.modelUrl.trim();if(!/^https:\/\/teachablemachine\.withgoogle\.com\/models\/[^/]+\/?$/.test(u)||u.includes('여기에-'))throw new Error('티처블 머신 모델 공유 주소를 정확히 입력하세요.');return u.endsWith('/')?u:u+'/'}
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function render(predictions){$('bars').innerHTML='';let best=predictions[0];predictions.forEach(p=>{if(p.probability>best.probability)best=p;const row=document.createElement('div');row.innerHTML=`<div class="bar-head"><span></span><b>${(p.probability*100).toFixed(1)}%</b></div><div class="bar-track"><div class="bar-fill"></div></div>`;row.querySelector('span').textContent=p.className;row.querySelector('.bar-fill').style.width=`${p.probability*100}%`;$('bars').append(row)});$('winner').textContent=`${best.className} · ${(best.probability*100).toFixed(1)}%`}
async function loop(){if(!running)return;webcam.update();render(await model.predict(webcam.canvas));raf=requestAnimationFrame(loop)}
async function start(){if(running)return;try{$('start').disabled=true;status('모델을 불러오는 중입니다…');const url=baseUrl();model=await tmImage.load(url+'model.json',url+'metadata.json');status('카메라 권한을 요청하는 중입니다…');webcam=new tmImage.Webcam(420,420,true);await webcam.setup($('camera').value);await webcam.play();$('viewer').replaceChildren(webcam.canvas);running=true;$('stop').disabled=false;$('camera').disabled=true;status('카메라가 실행 중입니다. 새로운 대상으로 시험해 보세요.');loop()}catch(e){console.error(e);status(e?.name==='NotAllowedError'?'카메라 권한이 거부되었습니다. 주소창의 사이트 설정에서 카메라를 허용하세요.':`시작하지 못했습니다. ${e?.message||'모델 주소와 카메라를 확인하세요.'}`,true);$('start').disabled=false}}
function stop(){running=false;cancelAnimationFrame(raf);if(webcam){webcam.stop();webcam=null}$('viewer').textContent='카메라가 중지되었습니다.';$('start').disabled=false;$('stop').disabled=true;$('camera').disabled=false;status('중지되었습니다. 다시 시작할 수 있습니다.')}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);window.addEventListener('pagehide',stop);fill();
</script>
</body>
</html>
