<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>음성 분류 AI 체험</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.2/dist/speech-commands.min.js"></script>
  <style>:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#172033;background:#f4f7fb;line-height:1.6}*{box-sizing:border-box}body{margin:0}main{width:min(900px,100%);margin:auto;padding:24px 16px 56px}.hero,.card{background:#fff;border:1px solid #dce3ed;border-radius:18px;box-shadow:0 8px 30px #1d35570d}.hero{padding:clamp(24px,5vw,48px);background:linear-gradient(135deg,#f1f5ff,#fff)}.eyebrow{margin:0;color:#6152b3;font-size:.78rem;font-weight:800;letter-spacing:.08em}.hero h1{margin:.35rem 0 .5rem;font-size:clamp(1.75rem,5vw,3rem);line-height:1.2}.hero p{margin:.3rem 0;color:#526074}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.card{padding:20px}.card h2{margin:0 0 12px;font-size:1.12rem}.lab{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px}.mic{display:grid;place-items:center;min-height:210px;border-radius:14px;background:#17152e;color:#fff;text-align:center}.mic-dot{width:70px;height:70px;border-radius:50%;background:#7e71d4;box-shadow:0 0 0 18px #7e71d426}.mic.running .mic-dot{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 28px #7e71d414}}.controls{display:flex;gap:8px;margin:14px 0}.controls button{flex:1;min-height:46px;border:0;border-radius:10px;background:#6557b8;color:#fff;font:inherit;font-weight:750;cursor:pointer}.controls button.secondary{background:#e8eef6;color:#27364d}.controls button:disabled{opacity:.45}.status{min-height:48px;padding:11px 13px;border-radius:10px;background:#f0effc;color:#413a72}.status.error{background:#fff0f0;color:#a32727}.winner{min-height:100px;padding:18px;border-radius:14px;background:#f2f0ff;text-align:center}.winner small{display:block;color:#526074}.winner strong{display:block;margin-top:4px;color:#5546a6;font-size:1.65rem}.bars{display:grid;gap:10px;margin-top:16px}.bar-head{display:flex;justify-content:space-between}.bar-track{height:10px;overflow:hidden;border-radius:99px;background:#e6ebf2}.bar-fill{height:100%;background:#7567c8}.notice{color:#5e6878;font-size:.86rem}.footer-card{margin-top:16px}.footer-card dl{display:grid;grid-template-columns:max-content 1fr;gap:7px 14px}.footer-card dt{font-weight:800}.footer-card dd{margin:0;color:#526074}@media(max-width:700px){main{padding:12px}.meta,.lab{grid-template-columns:1fr}.hero,.card{border-radius:14px}.footer-card dl{grid-template-columns:1fr}.footer-card dd{margin-bottom:8px}}</style>
</head>
<body><main><header class="hero"><p class="eyebrow">TEACHABLE MACHINE · AUDIO</p><h1 id="projectTitle"></h1><p id="summary"></p><p><b id="team"></b> · <span id="members"></span></p></header><section class="meta"><article class="card"><h2>해결하려는 문제</h2><p id="problem"></p></article><article class="card"><h2>주요 사용자</h2><p id="user"></p></article></section><section class="lab"><article class="card"><h2>모델 직접 시험하기</h2><div class="mic" id="mic"><div><div class="mic-dot"></div><p id="micText">시작 버튼을 누르면 마이크가 열립니다.</p></div></div><div class="controls"><button id="start">시작</button><button id="stop" class="secondary" disabled>중지</button></div><div id="status" class="status" role="status" aria-live="polite">모델을 시작할 준비가 되었습니다.</div></article><article class="card"><h2>분류 결과</h2><div class="winner"><small>가장 높은 예측</small><strong id="winner">아직 예측하지 않았습니다</strong></div><div id="bars" class="bars"></div><p class="notice">배경 소음 클래스도 모델의 실제 클래스입니다. 확률이 높아도 사람이 실제 소리를 다시 확인하세요.</p></article></section><section class="card footer-card"><h2>사용 전에 확인하세요</h2><dl><dt>모델의 한계</dt><dd id="limits"></dd><dt>사람이 확인할 부분</dt><dd id="humanCheck"></dd></dl></section></main>
<script>
// ===== 여기부터 학생이 수정 =====
const CONFIG={modelUrl:"https://teachablemachine.withgoogle.com/models/여기에-모델-ID/",projectTitle:"우리 팀 음성 분류 AI",summary:"마이크로 소리를 들려주면 모델이 소리의 종류를 분류합니다.",team:"팀명",members:"팀원 이름",problem:"STEP 1에서 정한 해결하려는 문제",user:"이 모델이 필요한 주요 사용자",limits:"STEP 3에서 확인한 모델의 한계",humanCheck:"결과를 사용하기 전에 사람이 최종 확인할 내용"};
// ===== 여기까지 학생이 수정 =====
const $=id=>document.getElementById(id);let recognizer=null,running=false;
function fill(){['projectTitle','summary','team','members','problem','user','limits','humanCheck'].forEach(k=>$(k).textContent=CONFIG[k]);document.title=CONFIG.projectTitle}function baseUrl(){const u=CONFIG.modelUrl.trim();if(!/^https:\/\/teachablemachine\.withgoogle\.com\/models\/[^/]+\/?$/.test(u)||u.includes('여기에-'))throw new Error('티처블 머신 모델 공유 주소를 정확히 입력하세요.');return u.endsWith('/')?u:u+'/'}function status(m,e=false){$('status').textContent=m;$('status').classList.toggle('error',e)}
function render(labels,scores){$('bars').innerHTML='';let best=0;scores.forEach((score,i)=>{if(score>scores[best])best=i;const row=document.createElement('div');row.innerHTML=`<div class="bar-head"><span></span><b>${(score*100).toFixed(1)}%</b></div><div class="bar-track"><div class="bar-fill" style="width:${score*100}%"></div></div>`;row.querySelector('span').textContent=labels[i];$('bars').append(row)});$('winner').textContent=`${labels[best]} · ${(scores[best]*100).toFixed(1)}%`}
async function start(){if(running)return;try{$('start').disabled=true;status('음성 모델을 불러오는 중입니다…');const u=baseUrl();recognizer=speechCommands.create('BROWSER_FFT',undefined,u+'model.json',u+'metadata.json');await recognizer.ensureModelLoaded();const labels=recognizer.wordLabels();status('마이크 권한을 요청하는 중입니다…');await recognizer.listen(result=>render(labels,Array.from(result.scores)),{includeSpectrogram:true,probabilityThreshold:0,overlapFactor:.5});running=true;$('stop').disabled=false;$('mic').classList.add('running');$('micText').textContent='마이크 입력을 듣고 있습니다.';status('마이크가 실행 중입니다. 새로운 소리로 시험해 보세요.')}catch(e){console.error(e);status(e?.name==='NotAllowedError'?'마이크 권한이 거부되었습니다. 주소창의 사이트 설정에서 마이크를 허용하세요.':`시작하지 못했습니다. ${e?.message||'모델 주소와 마이크를 확인하세요.'}`,true);$('start').disabled=false}}
function stop(){if(recognizer?.isListening())recognizer.stopListening();running=false;$('start').disabled=false;$('stop').disabled=true;$('mic').classList.remove('running');$('micText').textContent='마이크가 중지되었습니다.';status('중지되었습니다. 다시 시작할 수 있습니다.')}$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);window.addEventListener('pagehide',stop);fill();
</script></body></html>
